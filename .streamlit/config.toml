# Streamlit's own theme. utils/style.py paints the app itself and follows whichever
# theme the viewer has chosen, so this block mainly sets what the first paint looks
# like and what Streamlit uses for its own toolbar and menus in light mode.
[theme]
base = "light"
primaryColor = "#553a9e"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ececed"
textColor = "#14151a"
borderColor = "#868c98"
font = "Literata:https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"

[theme.sidebar]
backgroundColor = "#ececed"

[client]
toolbarMode = "minimal"
